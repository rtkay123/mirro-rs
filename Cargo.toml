[workspace]
members = [ "crates/*" ]
resolver = "3"

[workspace.dependencies]
itertools = "0.15.0"
serde = "1.0.200"
serde_json = "1.0.116"
tokio = "1.37.0"
toml = "1.1.8"

[workspace.package]
repository = "https://github.com/rtkay123/mirro-rs"
edition = "2024"

[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1
