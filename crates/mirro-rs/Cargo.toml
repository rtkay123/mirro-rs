[package]
name = "mirro-rs"
version = "0.2.3"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "An ArchLinux mirrorlist manager with a TUI"
authors = ["rtkay123 <dev@kanjala.com>"]
keywords = ["http", "tui", "linux"]
categories = ["command-line-interface", "command-line-utilities"]
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "5.0.1"
futures-util = "0.3.30"
figment = { version = "0.10", features = ["toml"], optional = true }
itertools.workspace = true
archlinux = { package = "mirrors-arch", version = "0.1.3", path = "../archlinux", features = ["time"] }
notify = { version = "7.0.0", optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "time"] }
toml = { workspace = true, optional = true }
tui-logger = { version = "0.18.3", features = ["crossterm", "tracing-support"], default-features = false }
unicode-width = "0.1.12"
ratatui = { version = "0.30.2", features = ["crossterm"], default-features = false }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
tracing-journald = "0.3.0"

[features]
default = []
toml = ["dep:figment", "dep:toml", "dep:notify"]

[dev-dependencies]
toml.workspace = true

[build-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
clap_complete = "4.5.2"
clap_mangen = "0.3.0"
serde = { workspace = true, features = ["derive"] }
